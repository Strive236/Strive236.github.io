short_bio: >-
  <p>
  I am a senior student majoring in Software Engineering at <a href="https://www.xjtu.edu.cn/" target="_blank">Xi’an Jiaotong University</a>. I have been granted direct admission to the School of Computer Science at <a href="https://www.sysu.edu.cn/" target="_blank">Sun Yat-sen University</a>, where I will be working under the guidance of Professor <a href="https://cse.sysu.edu.cn/teacher/LuWei" target="_blank">Wei Lu</a>.
  </p>
  <p>
    My research interests include <strong>AIGC authenticity verification and security</strong>, <strong>Model watermarking (both traditional and generative model watermarking)</strong>. Currently, I am working on <strong>a black-box robust watermarking scheme for image classification models</strong>, aiming to publish my first paper.
  </p>
  <p>
  I aspire to contribute to the fields of <strong>AI security</strong> and <strong>Model intellectual property protection</strong>, enabling artificial intelligence to develop faster and benefit more people.
  </p>
  <p>
    Looking for <strong>Research Internship</strong> opportunities to gain my first industry experience and further enhance my skills.
  </p>
  <p>
    Thank you for watching.
  </p>

